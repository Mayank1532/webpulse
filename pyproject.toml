[project]
name = "webpulse"
version = "0.1.0"
description = "WEBPULSE - Agentic Live Web Intelligence with Claude and MCP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.122.0",
    "beautifulsoup4>=4.13,<5.0",
    "httpx>=0.28,<1.0",
    "mcp>=2,<3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<0.13",
    "mypy>=1.17,<2.0",
    "pre-commit>=4.3,<5.0",
    "pytest-asyncio>=1.0,<2.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "webpulse"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
